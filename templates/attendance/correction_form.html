{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card narrow">
    <h1>{{ title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Save</button>
        <a class="button secondary" href="{% url 'attendance:correction_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
