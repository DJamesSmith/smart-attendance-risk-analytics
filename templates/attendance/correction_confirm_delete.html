{% extends "base.html" %}
{% block title %}Delete correction{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4">Delete correction #{{ correction.pk }}?</h1>
                <p>This removes your pending request for {{ correction.attendance_log }}.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, delete</button>
                    <a class="btn btn-outline-secondary" href="{% url 'attendance:correction_detail' correction.pk %}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
