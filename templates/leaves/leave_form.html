{% extends "base.html" %}
{% block title %}Apply for leave{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-4">Apply for leave</h1>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% include "includes/form_fields.html" %}
                    <p class="form-text">Supporting document is optional (PDF, JPG or PNG, up to 2 MB).</p>
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <a class="btn btn-outline-secondary" href="{% url 'leaves:list' %}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
