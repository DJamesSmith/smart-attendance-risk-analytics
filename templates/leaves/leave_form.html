{% extends "base.html" %}
{% block title %}Apply for leave{% endblock %}
{% block content %}
<div class="card narrow">
    <h1>Apply for leave</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <p class="muted">Supporting document is optional (PDF, JPG or PNG, up to 2 MB).</p>
        <button type="submit" class="button">Submit</button>
        <a class="button secondary" href="{% url 'leaves:list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
